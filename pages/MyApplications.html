<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Applications | E-Ayuda</title>
    <link rel="stylesheet" href="../css/Public.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" rel="stylesheet">
    <script type="module" src="../js/my-applications.js"></script>
  </head>
  <body class="account-page">
    <header class="topbar">
      <a class="brand" href="Home.html" aria-label="E-Ayuda home">
        <div class="brand-copy">
          <div class="brand-name">E-Ayuda</div>
        </div>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="Home.html">
          <span>Home</span>
        </a>
        <a href="Home.html#programs">Programs</a>
        <a href="Home.html#steps">How it works</a>
      </nav>

      <div class="account-actions">
        <button id="account-sign-out" class="portal-link" type="button" hidden>Sign Out <span>→</span></button>
      </div>
    </header>

    <main class="my-applications">
      <section class="account-hero-copy" aria-labelledby="account-title">
        <p class="programs-label">YOUR ACCOUNT</p>
        <h1 id="account-title">My applications</h1>
        <p class="helper-text" id="account-intro">Checking your sign-in…</p>
        <a class="account-back-link" href="Home.html#programs">Browse available programs</a>
      </section>
      <section class="account-results" aria-label="Application history">
        <p class="panel-tag">APPLICATION HISTORY</p>
        <div id="my-applications-list" class="my-applications-list" aria-live="polite"></div>
        <p id="account-message" class="account-message" role="status" aria-live="polite"></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p class="footer-note">Need help applying? Visit your Barangay Hall or call (02) 8888-1234.</p>
      </div>
    </footer>
  </body>
</html>
